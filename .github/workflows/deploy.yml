# 构建 Vite 产物并发布到 GitHub Pages
#
# 触发：push 到 main / 手动运行
# 前提：仓库 Settings → Pages → Build and deployment → Source = "GitHub Actions"
#
# 关键点：
#  1. base 路径：vite.config.ts 读取 GITHUB_REPOSITORY 自动推断 "/<repo>/"，
#     因此项目站点（https://<user>.github.io/<repo>/）不会出现资源 404 白屏。
#  2. API 地址：通过仓库 Variables / Secrets 注入 VITE_API_BASE_URL，
#     使同一份代码可以指向本地 Mock API 或线上真实 API。
#  3. 权限：pages: write + id-token: write 是 deploy-pages 的硬性要求。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个 Pages 部署；不取消进行中的任务，避免线上出现半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & upload artifact
    runs-on: ubuntu-latest
    # ★ 关键：build 必须也声明 environment，
    #   否则配置在 Environment(github-pages) 作用域下的 Variables 读不到，
    #   表现为「deploy 能读到、但构建产物里 API 地址为空 → 请求同源 github.io」。
    environment:
      name: github-pages
    outputs:
      api_base: ${{ steps.api-base.outputs.api_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve API base
        # vars（仓库/环境级 Variable）优先，其次 secrets，方便两种用法都能跑通
        id: api-base
        env:
          FROM_VARS: ${{ vars.VITE_API_BASE_URL }}
          FROM_SECRETS: ${{ secrets.VITE_API_BASE_URL }}
          # 允许显式覆盖（例如临时指向本地 Mock）
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: |
          # 校验：为空 / 非绝对地址时直接失败，避免静默降级为同源 /api
          node scripts/check-api-base.mjs
          echo "api_base=$VITE_API_BASE_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### 构建参数"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| VITE_API_BASE_URL | \`${VITE_API_BASE_URL}\` |"
            echo "| 来源 | $([ -n \"$FROM_VARS\" ] && echo 'Variables' || { [ -n \"$FROM_SECRETS\" ] && echo 'Secrets' || echo '未配置'; }) |"
            echo "| 站点 base | 由 GITHUB_REPOSITORY 自动推断为 /${GITHUB_REPOSITORY#*/}/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        # npm run build = vue-tsc --noEmit && vite build（类型不过直接失败）
        env:
          VITE_API_BASE_URL: ${{ steps.api-base.outputs.api_base }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          echo "### 部署完成 :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 站点地址：${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- API 地址：\`${{ needs.build.outputs.api_base }}\`" >> $GITHUB_STEP_SUMMARY
